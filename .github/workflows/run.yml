name: Cartier Reservation Checker

on:
  workflow_dispatch:

# ワークフローを自ら無効化するための権限設定
permissions:
  actions: write

jobs:
  check-and-reserve:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリとPlaywrightブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 予約自動化スクリプトの実行
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PHONE: ${{ secrets.USER_PHONE }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 予約完了時に次回以降の監視を自動無効化
        if: always() && hashFiles('reservation_success.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "【予約完了】完了フラグを検知しました。次回以降の自動監視をストップします。"
          gh workflow disable "${{ github.workflow }}"
